service {
    user root
    group root
    proto-fd-max 15000
    cluster-name docker
}

logging {
    file /var/log/aerospike/aerospike.log {
        context any info
    }
    console {
        context any info
    }
}

network {
    service {
        address ${SERVICE_ADDRESS}
        port ${SERVICE_PORT}
    }

    heartbeat {
        mode mesh
        address any
        port 3002
        interval 150
        timeout 10
    }

    fabric {
        port 3001
    }

    info {
        port 3003
    }
}

namespace test {
    replication-factor 1
    default-ttl ${DEFAULT_TTL}
    nsup-period ${NSUP_PERIOD}

    storage-engine device {
        file /opt/aerospike/data/test.dat
        filesize ${STORAGE_GB}G
        read-page-cache ${READ_PAGE_CACHE}
    }
}

namespace logs {
    replication-factor 1
    storage-engine memory {
        data-size ${MEM_GB}G
    }
}
